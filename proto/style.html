<!doctype html>
<html lang="en" data-theme="baseline" data-frame="desktop" data-neon="on">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INOUT — style prototype</title>
<!--
  STYLE PROTOTYPE — not part of the product.

  One self-contained file. No imports from src/, nothing imports it, it is not in
  vite's build input (only index.html is) and it is outside tsconfig's `include`,
  so `npm run build`, `npm run typecheck` and `npm test` never see it.

    npm run dev  →  http://localhost:5173/proto/style.html

  WHAT IT IS
  Every INOUT surface (idle · recording · editor · exporting · share) rendered as
  static mock content, so a style can be judged on the real thing instead of on
  swatches. The captured video content deliberately does NOT change with the
  theme — only the chrome around it does. That is the thing being tried.

  HOW TO TRY A STYLE
  1. Copy a block in "1. THEMES" (e.g. baseline), rename it, change the values.
  2. Add one <option> to the theme <select> in the harness bar below.
  3. Anything a token cannot express — a chip growing a colour tick, a squarer
     record button — goes in "3. THEME FLAVOUR" scoped to [data-theme="yours"].
  Keys: 1–5 switch screen, T cycles theme, F cycles frame.
-->
<style>
/* ==========================================================================
   0. HARNESS CHROME — always dark, never themed. This is the tool, not the app.
   ========================================================================== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #141416;
  color: #d8d8dc;
  font: 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
select { font: inherit; }

.bar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 16px;
  background: #101012;
  border-bottom: 1px solid #232327;
}
.bar__title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #6a6a74;
  white-space: nowrap;
}
.bar__title em { font-style: normal; color: #d8d8dc; }
.bar__tabs { display: flex; gap: 2px; background: #17171a; border-radius: 8px; padding: 2px; }
.bar__tab {
  padding: 5px 12px;
  border-radius: 6px;
  color: #85858f;
  font-size: 12px;
  transition: background 120ms, color 120ms;
}
.bar__tab:hover { color: #d8d8dc; }
.bar__tab[aria-selected='true'] { background: #2b2b31; color: #fff; }
.bar__spacer { flex: 1; }
.bar__field { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #85858f; }
.bar__field select {
  background: #17171a;
  color: #d8d8dc;
  border: 1px solid #2b2b31;
  border-radius: 6px;
  padding: 4px 8px;
}
.bar__note { font-size: 11px; color: #55555e; white-space: nowrap; }

.canvas {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  overflow: auto;
  background:
    repeating-conic-gradient(#141416 0% 25%, #17171a 0% 50%) 50% / 22px 22px;
}
/* The frame keeps its true pixel size and is scaled to fit the pane, so a
   layout is always judged at the size it will really have. */
.slot { position: relative; flex: none; }
.frame {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: top left;
  overflow: hidden;
  border-radius: 14px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
}
[data-frame='phone'] .frame { border-radius: 36px; }

/* ==========================================================================
   1. THEMES — the whole point. Each block is one style. Same token names.
   ========================================================================== */

/* --- baseline: today's product, value-for-value from src/styles/tokens.css --- */
[data-theme='baseline'] {
  --bg: #0a0a0c;
  --ground: radial-gradient(120% 90% at 50% 30%, #101013 0%, #0a0a0c 70%);
  --surface: #151518;
  --surface-2: #1e1e23;
  --surface-3: #2a2a31;
  --overlay: rgba(10, 10, 12, 0.72);
  --edge: transparent;
  --edge-w: 0px;
  --stage-edge: #1e1e23;

  --text: #f5f5f7;
  --text-dim: #98989f;
  --text-faint: #5c5c66;

  --record: #ff3b30;
  --record-soft: rgba(255, 59, 48, 0.16);
  --accent: #0a84ff;
  --accent-soft: rgba(10, 132, 255, 0.16);
  --on-accent: #f5f5f7;
  --ok: #30d158;
  --warn: #ffd60a;

  --ch-screen: #0a84ff;
  --ch-camera: #bf5af2;
  --ch-mic: #30d158;
  --ch-sys: #ff9f0a;
  --playhead: #6969cb;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-full: 999px;
  --r-chip: 999px;
  --r-btn: 999px;
  --r-bar: 3px;
  --gutter: 100px;

  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
  --wordmark-size: 12px;
  --wordmark-track: 0.24em;
  --label-track: 0;
  --label-transform: none;
  --weight-strong: 600;

  --shadow-1: none;
  --rec-ring: 3px solid var(--text);
  --kept-alpha: 0.42;
  --cut-alpha: 0.14;
}

/* --- graphite: same dark, but structural. Edges you can see, tight radii,
       numbers in mono everywhere, colour only as a marker beside neutral type. */
[data-theme='graphite'] {
  --bg: #0d0d0f;
  --ground: linear-gradient(180deg, #121215 0%, #0d0d0f 100%);
  --surface: #16161a;
  --surface-2: #1b1b20;
  --surface-3: #24242b;
  --overlay: rgba(13, 13, 15, 0.78);
  --edge: #2e2e37;
  --edge-w: 1px;
  --stage-edge: #34343f;

  --text: #ececed;
  --text-dim: #9a9aa4;
  --text-faint: #63636e;

  --record: #f2564b;
  --record-soft: rgba(242, 86, 75, 0.14);
  --accent: #5b9dff;
  --accent-soft: rgba(91, 157, 255, 0.14);
  --on-accent: #08080a;
  --ok: #4bd07a;
  --warn: #e8c34a;

  --ch-screen: #5b9dff;
  --ch-camera: #c17ef0;
  --ch-mic: #4bd07a;
  --ch-sys: #eda54a;
  --playhead: #ececed;

  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 8px;
  --r-full: 4px;
  --r-chip: 4px;
  --r-btn: 5px;
  --r-bar: 1px;
  --gutter: 116px;

  --font: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
  --wordmark-size: 11px;
  --wordmark-track: 0.34em;
  --label-track: 0.06em;
  --label-transform: uppercase;
  --weight-strong: 500;

  --shadow-1: none;
  --rec-ring: 2px solid var(--text-faint);
  --kept-alpha: 0.62;
  --cut-alpha: 0.1;
}

/* --- paper: warm light. Surfaces separate by a small step, never by luminance
       extremes; the stage stays dark because video needs a dark ground. --- */
[data-theme='paper'] {
  --bg: #efece5;
  --ground: linear-gradient(180deg, #f5f2ec 0%, #e9e5dc 100%);
  --surface: #ffffff;
  --surface-2: #e6e1d7;
  --surface-3: #d8d2c5;
  --overlay: rgba(239, 236, 229, 0.78);
  --edge: #d9d3c7;
  --edge-w: 1px;
  --stage-edge: #cdc6b8;

  --text: #1b1915;
  --text-dim: #6b655a;
  --text-faint: #9a9387;

  --record: #c8352b;
  --record-soft: rgba(200, 53, 43, 0.12);
  --accent: #1f5fd0;
  --accent-soft: rgba(31, 95, 208, 0.12);
  --on-accent: #ffffff;
  --ok: #2f8f4e;
  --warn: #b07d10;

  --ch-screen: #1f5fd0;
  --ch-camera: #8a44c4;
  --ch-mic: #2f8f4e;
  --ch-sys: #c9791a;
  --playhead: #1b1915;

  --r-sm: 8px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-full: 999px;
  --r-chip: 999px;
  --r-btn: 999px;
  --r-bar: 3px;
  --gutter: 100px;

  --font: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
  --wordmark-size: 12px;
  --wordmark-track: 0.26em;
  --label-track: 0;
  --label-transform: none;
  --weight-strong: 600;

  --shadow-1: 0 1px 2px rgba(30, 24, 12, 0.07), 0 6px 18px rgba(30, 24, 12, 0.06);
  --rec-ring: 3px solid var(--text);
  --kept-alpha: 0.55;
  --cut-alpha: 0.13;
}

/* ==========================================================================
   2. APP — layout shared by every theme. Mirrors src/app/app.css structure.
   ========================================================================== */
.app {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* The frame is the viewport: cqh replaces the product's dvh, so the stage,
     timeline and panels size off the frame exactly as they do off a window. */
  container-type: size;
  --col: min(100%, calc((100cqh - 300px) * 16 / 9));
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
.screen { position: absolute; inset: 0; }
.screen[hidden] { display: none; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: var(--r-btn);
  font-size: 14px;
  font-weight: var(--weight-strong);
  border: var(--edge-w) solid transparent;
  white-space: nowrap;
  transition: background 140ms, color 140ms, transform 140ms;
}
.btn:active { transform: scale(0.98); }
.btn--primary { background: var(--accent); color: var(--on-accent); }
.btn--surface { background: var(--surface-2); color: var(--text); border-color: var(--edge); }
.btn--surface:hover { background: var(--surface-3); }
.btn--ghost { color: var(--text-dim); }
.btn--ghost:hover { color: var(--text); background: var(--surface-2); }
.btn--wide { width: 100%; }

/* ---------- capture ground: the studio's grid, lifted from inout copy 2 ----------
   body::before there — cell grid + bottom glow, tilted toward the pointer and
   bumped by the elastic scroll spring. Same values, one layer instead of two
   pseudo-elements. Neon on every theme, by decision; the four vars below are
   the whole look, so retuning it per theme is a four-line job. */
.app {
  --grid-ink: #050810;
  --grid-line: rgba(0, 240, 255, 0.03);
  --grid-glow: rgba(0, 255, 200, 0.08);
  --grid-cell: 24px;
  --neon: 0, 240, 255;
}
.capture { position: relative; height: 100%; background: var(--grid-ink); }
.capture--recording { background: var(--grid-ink); }
.capture__grid {
  position: absolute;
  inset: -14%;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
    radial-gradient(ellipse 100% 80% at 50% 120%, var(--grid-glow), transparent 50%);
  background-size: var(--grid-cell) var(--grid-cell), var(--grid-cell) var(--grid-cell), 100% 100%;
  /* pointer parallax + hub bump, exactly as the source composes them */
  background-position:
    calc(50% + var(--bg-shift-x, 0px) + var(--bump-x, 0px))
    calc(50% + var(--bg-shift-y, 0px) + var(--bump-y, 0px));
  background-repeat: repeat, repeat, no-repeat;
  transform-origin: 50% 50%;
  transform: perspective(1600px)
    rotateX(calc(var(--tilt-y, 0) * -3deg))
    rotateY(calc(var(--tilt-x, 0) * 3deg));
  will-change: transform;
}
.capture__vignette {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: linear-gradient(
    90deg,
    rgba(0, 0, 0, 0) 0%,
    rgba(0, 0, 0, 0) 44%,
    rgba(2, 3, 8, 0.38) 78%,
    rgba(0, 0, 0, 0.52) 100%
  );
}

/* ---------- centre cluster: record button with the inputs in orbit ---------- */
.cluster-anchor {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 6;
}
/* the spring writes translate3d here — nothing else may own this transform */
.cluster { will-change: transform; }
.ring {
  position: relative;
  width: 340px;
  height: 340px;
  display: grid;
  place-items: center;
}
.ring .chip {
  position: absolute;
  left: 50%;
  top: 50%;
}
.cluster__hint {
  margin-top: -34px;
  text-align: center;
  font-size: 12px;
  color: var(--text-faint);
  min-height: 17px;
}
.capture__wordmark {
  position: absolute;
  top: 20px;
  left: 24px;
  font-size: var(--wordmark-size);
  font-weight: 700;
  letter-spacing: var(--wordmark-track);
  color: var(--text-faint);
  z-index: 5;
}
/* Framed exactly where the editor puts its stage — same width, same centre —
   so the picture does not move on the hand-off from recording to editing. */
.capture__preview {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 16px 194px;
}
/* the editor's transport height + gap, so the stage centres on the same line */
.capture__preview .player { padding-bottom: 52px; }

.timer {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface-2);
  border: var(--edge-w) solid var(--edge);
  padding: 6px 13px;
  border-radius: var(--r-full);
  box-shadow: var(--shadow-1);
  z-index: 5;
}
.timer__dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--record);
  animation: pulse 1.2s cubic-bezier(.25,.1,.25,1) infinite;
}
.timer__text {
  font-family: var(--font-mono);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }

.controlbar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 0 16px 28px;
  z-index: 10;
}
.controlbar__hint { font-size: 12px; color: var(--text-faint); min-height: 17px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.chip {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: var(--r-chip);
  background: var(--surface-2);
  border: var(--edge-w) solid var(--edge);
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: var(--label-track);
  transition: background 140ms, color 140ms;
}
.chip:hover { background: var(--surface-3); }
.chip[aria-pressed='true'] {
  background: var(--accent-soft);
  border-color: color-mix(in srgb, var(--accent), transparent 65%);
  color: var(--accent);
}
.chip--unavailable { background: var(--record-soft); color: var(--record); }

/* Look is untouched. Behaviour is the studio's rec-go: no hover scale — a neon
   shine instead, a 0.97 press with a short transition, and an arming pulse on
   the source's blink easing. Toggle "Neon" off to fall back to the plain hover. */
.recbtn {
  width: 72px; height: 72px;
  border-radius: var(--r-btn);
  border: var(--rec-ring);
  display: grid;
  place-items: center;
  transition:
    transform 0.2s cubic-bezier(0.34, 1.2, 0.64, 1),
    filter 0.22s ease,
    opacity 0.2s ease;
}
[data-neon='off'] .recbtn:hover { transform: scale(1.05); }
[data-neon='on'] .recbtn:hover {
  filter:
    drop-shadow(0 0 8px rgba(var(--neon), 0.38))
    drop-shadow(0 0 26px rgba(var(--neon), 0.22));
}
.recbtn:active {
  transform: scale(0.97);
  transition-duration: 0.08s;
}
.recbtn--arming {
  animation: recArming 1.2s cubic-bezier(0.45, 0, 0.35, 1) infinite;
  cursor: wait;
}
@keyframes recArming {
  0%, 100% { filter: drop-shadow(0 0 0 rgba(var(--neon), 0)); }
  50% { filter: drop-shadow(0 0 14px rgba(var(--neon), 0.45)); }
}
.recbtn__inner {
  width: 56px; height: 56px;
  border-radius: var(--r-btn);
  background: var(--record);
  transition: all 240ms cubic-bezier(.25,.1,.25,1);
}
.recbtn--stop .recbtn__inner { width: 26px; height: 26px; border-radius: max(4px, calc(var(--r-btn) / 140)); }

/* ---------- stage (the composed 16:9 frame) ---------- */
.stage {
  position: relative;
  aspect-ratio: 16 / 9;
  width: 100%;
  background: #08080a;
  border-radius: var(--r-md);
  overflow: hidden;
  border: 1px solid var(--stage-edge);
  box-shadow: var(--shadow-1);
}
/* Mock captured pixels. Fixed colours on purpose: the video does not change
   when the chrome does, so themes are compared on chrome alone. */
.mock { position: absolute; inset: 0; background: #16181d; display: flex; flex-direction: column; }
.mock__bar {
  flex: none;
  height: 9%;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 10px;
  background: #1e2128;
  border-bottom: 1px solid #272b34;
}
.mock__bar i { width: 7px; height: 7px; border-radius: 50%; background: #3a3f4b; }
.mock__url {
  margin-left: 8px;
  font: 500 9px/1 ui-monospace, monospace;
  color: #6d7480;
  background: #171a20;
  padding: 4px 8px;
  border-radius: 4px;
}
.mock__body { flex: 1; display: flex; gap: 12px; padding: 14px; }
.mock__side { flex: none; width: 22%; display: flex; flex-direction: column; gap: 7px; }
.mock__side span { height: 7px; border-radius: 3px; background: #232830; }
.mock__side span:nth-child(2) { width: 78%; background: #2c3542; }
.mock__side span:nth-child(4) { width: 60%; }
.mock__main { flex: 1; display: flex; flex-direction: column; gap: 9px; }
.mock__h { height: 12px; width: 46%; border-radius: 4px; background: #39414f; }
.mock__l { height: 7px; border-radius: 3px; background: #232830; }
.mock__l:nth-of-type(3) { width: 88%; }
.mock__l:nth-of-type(4) { width: 71%; }
.mock__chart { margin-top: auto; display: flex; align-items: flex-end; gap: 6px; height: 38%; }
.mock__chart i { flex: 1; border-radius: 2px 2px 0 0; background: #2b3340; }
.mock__chart i:nth-child(3) { background: #3d5273; }
.mock__chart i:nth-child(6) { background: #3d5273; }

.pip {
  position: absolute;
  width: 24%;
  right: 1.25%;
  bottom: 2.2%;
  aspect-ratio: 4 / 3;
  border-radius: var(--r-lg);
  border: 1px solid rgba(255, 255, 255, 0.25);
  overflow: hidden;
  background: linear-gradient(165deg, #3c3550 0%, #211d2c 100%);
  z-index: 2;
}
.pip::before {
  content: '';
  position: absolute;
  left: 50%; top: 26%;
  width: 26%; aspect-ratio: 1;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #8a7fa8;
}
.pip::after {
  content: '';
  position: absolute;
  left: 50%; bottom: -14%;
  width: 62%; aspect-ratio: 1.5;
  transform: translateX(-50%);
  border-radius: 50% 50% 0 0;
  background: #6f6690;
}
.stage__badge {
  position: absolute;
  top: 10px; right: 10px;
  z-index: 3;
  display: grid;
  place-items: center;
  width: 34px; height: 34px;
}
.stage__badge span {
  position: absolute;
  width: 30px; height: 30px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  opacity: 0.45;
  animation: ring 1.6s cubic-bezier(.25,.1,.25,1) infinite;
}
.stage__badge b { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
@keyframes ring { 0%, 100% { transform: scale(0.8) } 50% { transform: scale(1.1) } }

/* ---------- editor ---------- */
.editor { height: 100%; display: flex; flex-direction: column; padding: 0 16px; }
.editor__player {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 0;
}
.player {
  width: 100%;
  max-width: var(--col);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.transport { display: flex; align-items: center; gap: 14px; }
.transport__back, .transport__play {
  flex: none;
  display: grid;
  place-items: center;
  transition: background 140ms, color 140ms;
}
.transport__back {
  width: 30px; height: 30px;
  border-radius: var(--r-sm);
  color: var(--text-dim);
}
.transport__back:hover { background: var(--surface-2); color: var(--text); }
.transport__play {
  width: 38px; height: 38px;
  border-radius: var(--r-btn);
  background: var(--surface-3);
  color: var(--text);
  border: var(--edge-w) solid var(--edge);
}
.transport__play:hover { background: color-mix(in srgb, var(--surface-3), var(--text) 12%); }
.transport__time {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.transport__time span { color: var(--text-faint); }
.transport__export { flex: none; padding: 8px 20px; }

.scrubber { position: relative; flex: 1; height: 20px; cursor: pointer; }
.scrubber::before {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 8px;
  height: 4px;
  border-radius: var(--r-bar);
  background: var(--surface-3);

/* ---------- timeline ---------- */
.tl {
  position: relative;
  flex: none;
  width: 100%;
  max-width: var(--col);
  align-self: center;
  height: 184px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-bottom: 10px;
}
.tl__lanes {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
  padding: 8px 0;
}
.lane { flex: none; height: 24px; display: flex; align-items: stretch; }
.lane__gutter {
  width: var(--gutter);
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px 0 2px;
  color: var(--text-dim);
}
.lane__icon { display: grid; place-items: center; flex: none; }
.lane__label {
  flex: 1;
  font-size: 12px;
  letter-spacing: var(--label-track);
  text-transform: var(--label-transform);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lane__eye {
  flex: none;
  width: 22px; height: 22px;
  display: grid;
  place-items: center;
  border-radius: var(--r-sm);
  color: var(--text-dim);
}
.lane__eye[aria-pressed='false'] { color: var(--text-faint); }
.lane__eye:hover { background: var(--surface-2); color: var(--text); }
.lane__track { position: relative; flex: 1; }
.lane__bar { position: absolute; top: 1px; bottom: 1px; border-radius: var(--r-bar); overflow: hidden; }
.lane__seg { position: absolute; top: 0; bottom: 0; }
.lane__seg--kept { opacity: var(--kept-alpha); }
.lane__seg--cut { opacity: var(--cut-alpha); }
.lane--off .lane__bar { border: 1px dashed color-mix(in srgb, var(--text), transparent 70%); }
.lane--off .lane__seg--kept { opacity: calc(var(--kept-alpha) * 0.6); }
.lane__edge { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; z-index: 2; }
.lane__edge::after {
  content: '';
  position: absolute;
  left: 2px; top: 4px; bottom: 4px;
  width: 2px;
  border-radius: 1px;
  background: var(--text);
  opacity: 0.45;
}
.lane__edge:hover::after { opacity: 1; }

.tl__ruler-row { flex: none; height: 26px; display: flex; }
.tl__ruler { position: relative; flex: 1; overflow: hidden; }
.tl__tick { position: absolute; top: 0; height: 5px; width: 1px; background: var(--surface-3); }
.tl__tick span {
  position: absolute;
  top: 8px; left: 3px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
  white-space: nowrap;
}
.tl__overlay { position: absolute; left: var(--gutter); right: 0; top: 0; bottom: 0; pointer-events: none; }
.tl__dim { position: absolute; top: 0; bottom: 26px; background: var(--overlay); }
.tl__trim {
  position: absolute;
  top: 0; bottom: 26px;
  width: 14px;
  margin-left: -7px;
  display: flex;
  justify-content: center;
  pointer-events: auto;
  cursor: ew-resize;
}
.tl__trim span {
  width: 3px;
  border-radius: 2px;
  background: var(--text);
  opacity: 0.75;
}
.tl__trim:hover span { opacity: 1; }
.tl__playhead {
  position: absolute;
  top: 0; bottom: 20px;
  width: 2px;
  margin-left: -1px;
  background: var(--playhead);
  border-radius: 1px;
}
.tl__playhead::before {
  content: '';
  position: absolute;
  top: -1px; left: 50%;
  width: 9px; height: 9px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: var(--playhead);
}

/* ---------- export / share panel ---------- */

/* ==========================================================================
   2b. SPLASH — the mark from inout proto, animated properly.
   There it was a 5-frame flipbook stepped by setTimeout at 105ms — visibly
   choppy and 14.7 KB of duplicated path data. The mark is five separate paths
   (I·N·O·U·T), so each letter can carry its own motion: staggered rise on one
   spring-ish curve, a glow blooming behind them, out at 1.33s. GPU-only
   properties (opacity/transform), no timers driving frames.
   ========================================================================== */
#splash {
  position: absolute;
  inset: 0;
  z-index: 99;
  background: #000;
  display: grid;
  place-items: center;
  will-change: opacity, transform;
}
#splash[hidden] { display: none; }
#splash .swrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}
#splash .glow {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 130%;
  aspect-ratio: 2.4 / 1;
  transform: translate(-50%, -60%) scale(0.6);
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(232, 213, 160, 0.26), transparent 68%);
  filter: blur(16px);
  opacity: 0;
  pointer-events: none;
}
#logomark {
  position: relative;
  width: min(58%, 232px);
  height: auto;
  display: block;
  overflow: visible;
}
#logomark .lm {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: 50% 100%;
}
#splash .tag {
  text-align: center;
  font-size: 11.5px;
  color: #6e6a5f;
  margin-top: 14px;
  letter-spacing: 0.03em;
  opacity: 0;
}

.splash-play .lm { animation: lmIn 0.42s cubic-bezier(0.16, 1, 0.3, 1) both; }
.splash-play .lm--i { animation-delay: 0.06s; }
.splash-play .lm--n { animation-delay: 0.105s; }
.splash-play .lm--o { animation-delay: 0.15s; }
.splash-play .lm--u { animation-delay: 0.195s; }
.splash-play .lm--t { animation-delay: 0.24s; }
.splash-play .glow { animation: glowIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both; }
.splash-play .tag { animation: tagIn 0.5s ease 0.4s both; }
.splash-out { animation: splashOut 0.38s cubic-bezier(0.2, 1, 0.3, 1) both; }

@keyframes lmIn {
  from { opacity: 0; transform: translateY(26px) scaleY(0.82); }
  to { opacity: 1; transform: none; }
}
@keyframes glowIn {
  0% { opacity: 0; transform: translate(-50%, -60%) scale(0.6); }
  45% { opacity: 1; }
  100% { opacity: 0.55; transform: translate(-50%, -60%) scale(1); }
}
@keyframes tagIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}
@keyframes splashOut {
  to { opacity: 0; transform: scale(1.05); }
}

  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4.5A2.5 2.5 0 0 1 2 12.5v-8A2.5 2.5 0 0 1 4.5 2h8A2.5 2.5 0 0 1 15 4.5V5"/>',
  check: '<path d="M4.5 12.5l5 5.5L19.5 6"/>',
  play: '<path d="M8 5.4v13.2L19 12 8 5.4z" fill="currentColor" stroke-width="1"/>',
  pause: '<rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor" stroke-width="1"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor" stroke-width="1"/>',
  'chevron-left': '<path d="M14.5 5.5L8 12l6.5 6.5"/>',
}
const icon = (name, size = 18) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[name]}</svg>`

/* ---------- mock content ---------- */
const STAGE = `
  <div class="mock">
    <div class="mock__bar"><i></i><i></i><i></i><span class="mock__url">inout.app/record</span></div>
    <div class="mock__body">
      <div class="mock__side"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="mock__main">
        <div class="mock__h"></div>
        <div class="mock__l"></div><div class="mock__l"></div><div class="mock__l"></div>
        <div class="mock__chart"><i style="height:40%"></i><i style="height:62%"></i><i style="height:88%"></i><i style="height:54%"></i><i style="height:71%"></i><i style="height:96%"></i><i style="height:47%"></i><i style="height:66%"></i></div>
      </div>
    </div>
  </div>
  <div class="pip"></div>`

const CHANNELS = [
  { key: 'screen', label: 'Screen', ic: 'display', on: true },
  { key: 'camera', label: 'Camera', ic: 'camera', on: true },
  { key: 'mic', label: 'Mic', ic: 'mic', on: true },
  { key: 'sys', label: 'System audio', ic: 'waves', on: false },
]

/* lanes: [channel, startOffset%, width%, keptFrom%, keptTo%] — of the lane bar */
const LANES = [
  { key: 'screen', label: 'Screen', ic: 'display', left: 0, width: 100, kept: [6, 92], on: true },
  { key: 'camera', label: 'Camera', ic: 'camera', left: 4, width: 96, kept: [2, 90], on: true },
  { key: 'mic', label: 'Mic', ic: 'mic', left: 0, width: 100, kept: [6, 100], on: false },
]
const TRIM = { start: 6, end: 92 }
const PLAYHEAD = 24

/* ---------- build ---------- */
const app = document.getElementById('app')

document.querySelectorAll('[data-stage]').forEach((el) => (el.innerHTML = STAGE))
document.querySelectorAll('[data-icon]').forEach((el) => (el.innerHTML = icon(el.dataset.icon, el.classList.contains('transport__play') ? 18 : 20)))
document.querySelectorAll('[data-icon-before]').forEach((el) => el.insertAdjacentHTML('afterbegin', icon(el.dataset.iconBefore, 16)))

const chipHTML = (c) =>
  `<button class="chip" aria-pressed="${c.on}" data-chip="${c.key}">${icon(c.ic, 15)}<span>${c.label}</span></button>`

document.querySelectorAll('[data-chips]').forEach((row) => {
  row.innerHTML = CHANNELS.map(chipHTML).join('')
})

/* Inputs in orbit: same chips, unchanged, placed on a circle around the button.
   Screen top-left · Camera top-right · Mic bottom-left · System audio bottom-right. */
const RING_R = 132
const RING_ANGLE = { screen: -135, camera: -45, mic: 135, sys: 45 }
const ring = document.querySelector('[data-ring]')
CHANNELS.forEach((c) => {
  const a = (RING_ANGLE[c.key] * Math.PI) / 180
  ring.insertAdjacentHTML('beforeend', chipHTML(c))
  const el = ring.lastElementChild
  el.style.transform =
    `translate(-50%, -50%) translate(${(Math.cos(a) * RING_R).toFixed(1)}px, ${(Math.sin(a) * RING_R).toFixed(1)}px)`
})

document.querySelector('[data-timeline]').innerHTML = `
  <div class="tl__lanes">
    ${LANES.map((l) => `
      <div class="lane${l.on ? '' : ' lane--off'}" data-lane="${l.key}">
        <div class="lane__gutter">
          <span class="lane__icon" style="color: var(--ch-${l.key})">${icon(l.ic, 14)}</span>
          <span class="lane__label">${l.label}</span>
          <button class="lane__eye" aria-pressed="${l.on}" aria-label="Toggle ${l.label}">${icon(l.on ? 'eye' : 'eye-off', 14)}</button>
        </div>
        <div class="lane__track">
          <div class="lane__bar" style="left:${l.left}%; width:${l.width}%">
            <div class="lane__seg lane__seg--cut"  style="left:0; width:${l.kept[0]}%; background: var(--ch-${l.key})"></div>
            <div class="lane__seg lane__seg--kept" style="left:${l.kept[0]}%; width:${l.kept[1] - l.kept[0]}%; background: var(--ch-${l.key})"></div>
            <div class="lane__seg lane__seg--cut"  style="left:${l.kept[1]}%; right:0; background: var(--ch-${l.key})"></div>
            <div class="lane__edge" style="left:calc(${l.kept[0]}% - 3px)"></div>
            <div class="lane__edge" style="left:calc(${l.kept[1]}% - 3px)"></div>
          </div>
        </div>
      </div>`).join('')}
  </div>
  <div class="tl__ruler-row">
    <div class="lane__gutter"></div>
    <div class="tl__ruler">
      ${[0, 15, 30, 45, 60].map((s, i) => `
        <div class="tl__tick" style="left:${(i / 5) * 100}%"><span>${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}</span></div>`).join('')}
    </div>
  </div>
  <div class="tl__overlay">
    <div class="tl__dim" style="left:0; width:${TRIM.start}%"></div>
    <div class="tl__dim" style="left:${TRIM.end}%; right:0"></div>
    <div class="tl__trim" style="left:${TRIM.start}%"><span></span></div>
    <div class="tl__trim" style="left:${TRIM.end}%"><span></span></div>
    <div class="tl__playhead" data-playhead style="left:${PLAYHEAD}%"></div>
  </div>`

/* ---------- interaction (just enough to feel the style, no product logic) ---------- */
const SCREENS = ['idle', 'recording', 'editor', 'exporting', 'share']

function show(name) {
  app.querySelectorAll('.screen').forEach((s) => (s.hidden = s.dataset.screen !== name))
  document.querySelectorAll('.bar__tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === name)))
  stopPlay()
  clearInterval(expTimer)
  if (name === 'exporting') runExport()
}
document.querySelectorAll('.bar__tab').forEach((t) => t.addEventListener('click', () => show(t.dataset.tab)))
app.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]')
  if (go) show(go.dataset.go)
})

/* chips + hint */
const recBtn = app.querySelector('[data-rec]')
const hintEl = app.querySelector('[data-hint]')
function anyInputOn() {
  return [...ring.querySelectorAll('.chip')].some((c) => c.getAttribute('aria-pressed') === 'true')
}
function syncHint() {
  if (recBtn.classList.contains('recbtn--arming')) return
  const any = anyInputOn()
  hintEl.textContent = any ? '' : 'Turn on an input to record'
  recBtn.style.opacity = any ? '1' : '0.4'
}
app.addEventListener('click', (e) => {
  const chip = e.target.closest('[data-chip]')
  if (!chip) return
  chip.setAttribute('aria-pressed', String(chip.getAttribute('aria-pressed') !== 'true'))
  syncHint()
})
syncHint()

/* record button: the studio's state walk — press arms, arming pulses, then the
   take starts. Look untouched; only the states and their timing are borrowed. */
let armTimer = null
recBtn.addEventListener('click', () => {
  if (armTimer || !anyInputOn()) return
  recBtn.classList.add('recbtn--arming')
  hintEl.textContent = 'Starting…'
  armTimer = setTimeout(() => {
    armTimer = null
    recBtn.classList.remove('recbtn--arming')
    show('recording')
    syncHint()
  }, 900)
})

/* splash */
const splash = document.getElementById('splash')
let splashOut = null
let splashEnd = null
function playSplash() {
  clearTimeout(splashOut)
  clearTimeout(splashEnd)
  splash.hidden = false
  splash.classList.remove('splash-play', 'splash-out')
  void splash.offsetWidth // restart the keyframes
  splash.classList.add('splash-play')
  splashOut = setTimeout(() => splash.classList.add('splash-out'), 950)
  splashEnd = setTimeout(() => {
    splash.hidden = true
    splash.classList.remove('splash-play', 'splash-out')
  }, 1340)
}
document.getElementById('replay').addEventListener('click', playSplash)

/* ---- studio motion, lifted from inout copy 2 ----
   initBgGridPointerTilt: grid leans toward the pointer (lerp .11, ±10px shift).
   initElasticHubScroll:  wheel injects velocity into a damped spring that moves
   the cluster and drags the grid at 10% of it; walls bounce at 0.14. Same
   constants; the frame is the viewport instead of the window. */
;(function studioMotion() {
  const BG_LERP = 0.11
  const BG_SHIFT_MAX_PX = 10
  let curX = 0, curY = 0, tgtX = 0, tgtY = 0, tiltRaf = 0

  function tiltTick() {
    tiltRaf = 0
    curX += (tgtX - curX) * BG_LERP
    curY += (tgtY - curY) * BG_LERP
    app.style.setProperty('--tilt-x', curX.toFixed(5))
    app.style.setProperty('--tilt-y', curY.toFixed(5))
    app.style.setProperty('--bg-shift-x', `${(curX * BG_SHIFT_MAX_PX).toFixed(2)}px`)
    app.style.setProperty('--bg-shift-y', `${(curY * BG_SHIFT_MAX_PX).toFixed(2)}px`)
    if (Math.abs(tgtX - curX) > 0.0008 || Math.abs(tgtY - curY) > 0.0008) {
      tiltRaf = requestAnimationFrame(tiltTick)
    }
  }
  app.addEventListener('mousemove', (e) => {
    const r = app.getBoundingClientRect()
    tgtX = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width) * 2 - 1))
    tgtY = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height) * 2 - 1))
    if (!tiltRaf) tiltRaf = requestAnimationFrame(tiltTick)
  }, { passive: true })

  const cluster = app.querySelector('[data-cluster]')
  const stiffness = 118
  const damping = 17
  const wheelImpulse = 10.2
  const velCap = 5200
  const pixelDeltaBoost = 1.72
  const wallRestitution = 0.14
  const bgFollow = 0.1
  const edgePad = 2
  let posX = 0, posY = 0, velX = 0, velY = 0, physRaf = null, lastT = 0

  const live = () => !app.querySelector('[data-screen="idle"]').hidden

  function bounds() {
    // cluster is centred, so travel is symmetric — no rect maths, scale-proof
    const maxX = Math.max(0, (app.clientWidth - cluster.offsetWidth) / 2 - edgePad)
    const maxY = Math.max(0, (app.clientHeight - cluster.offsetHeight) / 2 - edgePad)
    return { maxX, maxY }
  }
  function apply(x, y) {
    posX = x
    posY = y
    if (Math.abs(x) < 0.02 && Math.abs(y) < 0.02) {
      cluster.style.transform = ''
      app.style.removeProperty('--bump-x')
      app.style.removeProperty('--bump-y')
    } else {
      cluster.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0)`
      app.style.setProperty('--bump-x', `${(x * bgFollow).toFixed(2)}px`)
      app.style.setProperty('--bump-y', `${(y * bgFollow).toFixed(2)}px`)
    }
  }
  function rest() {
    posX = posY = velX = velY = 0
    lastT = 0
    cluster.style.transform = ''
    app.style.removeProperty('--bump-x')
    app.style.removeProperty('--bump-y')
  }
  function step(t) {
    physRaf = null
    if (!lastT) lastT = t
    let dt = (t - lastT) / 1000
    lastT = t
    if (dt > 0.055) dt = 0.055
    if (dt <= 0) dt = 1 / 60

    velX += (-stiffness * posX - damping * velX) * dt
    velY += (-stiffness * posY - damping * velY) * dt
    posX += velX * dt
    posY += velY * dt

    const { maxX, maxY } = bounds()
    if (posX > maxX) { posX = maxX; velX *= -wallRestitution }
    else if (posX < -maxX) { posX = -maxX; velX *= -wallRestitution }
    if (posY > maxY) { posY = maxY; velY *= -wallRestitution }
    else if (posY < -maxY) { posY = -maxY; velY *= -wallRestitution }

    if (Math.hypot(posX, posY) < 0.55 && Math.hypot(velX, velY) < 6) return rest()
    apply(posX, posY)
    physRaf = requestAnimationFrame(step)
  }
  const kick = () => { if (physRaf == null) physRaf = requestAnimationFrame(step) }
  const norm = (d, mode) =>
    mode === 1 ? d * 16 : mode === 2 ? d * Math.min(900, app.clientHeight * 0.85) : d * pixelDeltaBoost

  app.addEventListener('wheel', (e) => {
    if (!live()) return
    const dx = norm(e.deltaX, e.deltaMode)
    const dy = norm(e.deltaY, e.deltaMode)
    if (!dx && !dy) return
    e.preventDefault()
    e.stopPropagation()
    velX += -dx * wheelImpulse
    velY += -dy * wheelImpulse
    const sp = Math.hypot(velX, velY)
    if (sp > velCap) { velX *= velCap / sp; velY *= velCap / sp }
    kick()
  }, { passive: false, capture: true })
})()

/* lane eye */
app.addEventListener('click', (e) => {
  const eye = e.target.closest('.lane__eye')
  if (!eye) return
  const on = eye.getAttribute('aria-pressed') !== 'true'
  eye.setAttribute('aria-pressed', String(on))
  eye.innerHTML = icon(on ? 'eye' : 'eye-off', 14)
  eye.closest('.lane').classList.toggle('lane--off', !on)
})

/* copy */
app.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-copy]')
  if (!btn) return
  btn.dataset.copied = '1'
  btn.innerHTML = icon('check', 18)
  setTimeout(() => {
    btn.dataset.copied = '0'
    btn.innerHTML = icon('copy', 18)
  }, 1200)
})

/* play — moves the scrubber, clock and playhead so motion can be judged too */
let raf = null
let t = 12
const DUR = 67
const clockText = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`
function stopPlay() {
  if (raf) cancelAnimationFrame(raf)
  raf = null
  app.querySelectorAll('[data-play]').forEach((b) => (b.innerHTML = icon('play', 18)))
}
app.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-play]')
  if (!btn) return
  if (raf) return stopPlay()
  btn.innerHTML = icon('pause', 18)
  let last = performance.now()
  const tick = (now) => {
    t = (t + (now - last) / 1000) % DUR
    last = now
    const f = t / DUR
    const screen = btn.closest('.screen')
    screen.querySelector('.scrubber__fill').style.width = `${f * 100}%`
    const clock = screen.querySelector('[data-clock]')
    if (clock) clock.textContent = clockText(t)
    const ph = app.querySelector('[data-playhead]')
    if (ph) ph.style.left = `${TRIM.start + f * (TRIM.end - TRIM.start)}%`
    raf = requestAnimationFrame(tick)
  }
  raf = requestAnimationFrame(tick)
})

/* export progress */
let expTimer = null
function runExport() {
  clearInterval(expTimer)
  let p = 0
  const pct = app.querySelector('[data-pct]')
  const meter = app.querySelector('[data-meter]')
  expTimer = setInterval(() => {
    p = p >= 100 ? 0 : Math.min(100, p + 2)
    pct.textContent = `${p}%`
    meter.style.width = `${p}%`
  }, 90)
}

/* harness controls */
const themeSel = document.getElementById('theme')
const frameSel = document.getElementById('frame')
const canvas = document.getElementById('canvas')
const slot = document.getElementById('slot')
const frameEl = document.getElementById('frameEl')
const note = document.getElementById('note')

/* true pixel size, scaled to fit the pane — never a reflowed approximation */
const SIZES = { desktop: [1040, 660], laptop: [820, 520], phone: [390, 800] }
function fit() {
  const [w, h] = SIZES[document.documentElement.dataset.frame]
  const box = canvas.getBoundingClientRect()
  const s = Math.min(1, (box.width - 48) / w, (box.height - 48) / h)
  frameEl.style.width = w + 'px'
  frameEl.style.height = h + 'px'
  frameEl.style.transform = `scale(${s})`
  slot.style.width = w * s + 'px'
  slot.style.height = h * s + 'px'
  note.textContent = `${w}×${h} · ${Math.round(s * 100)}% · 0 splash · 1–5 · T · F · N`
}
addEventListener('resize', fit)

const neonSel = document.getElementById('neon')
themeSel.addEventListener('change', () => (document.documentElement.dataset.theme = themeSel.value))
neonSel.addEventListener('change', () => (document.documentElement.dataset.neon = neonSel.value))
frameSel.addEventListener('change', () => {
  document.documentElement.dataset.frame = frameSel.value
  fit()
})
fit()
playSplash()

const cycle = (sel, list) => {
  const next = list[(list.indexOf(sel.value) + 1) % list.length]
  sel.value = next
  sel.dispatchEvent(new Event('change'))
}
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT') return
  const n = Number(e.key)
  if (e.key === '0') playSplash()
  else if (n >= 1 && n <= SCREENS.length) show(SCREENS[n - 1])
  else if (e.key.toLowerCase() === 't') cycle(themeSel, ['baseline', 'graphite', 'paper'])
  else if (e.key.toLowerCase() === 'f') cycle(frameSel, ['desktop', 'laptop', 'phone'])
  else if (e.key.toLowerCase() === 'n') cycle(neonSel, ['on', 'off'])
})
</script>
</body>
</html>
